# CI: unit tests only. No API keys, no network, no local model - the suite runs her with fakes
# (src/evaluation/scenarios.py), so it is the same on a laptop and on a runner.
#
# The runner is Windows on purpose: the app talks to a Windows QQ client (NapCat), uses PowerShell
# setup scripts and Windows paths, and several tests exercise Windows-only behaviour (firewall
# guards, .ps1/.bat handling, path separators). Testing the OS the project actually runs on keeps
# CI honest instead of green.
#
# CI never installs requirements-optional.txt: llama-cpp-python needs a compiler, and onnxruntime /
# tokenizers are only used when a local embedding model is present (tests skip that case).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 3.11 and 3.12 are the oldest/newest versions the project is expected to support.
        # The dev machine runs newer; do not add newer versions here without checking numpy/pytest.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        # Run from minimal-self so pytest.ini (testpaths = tests) applies and the tests'
        # relative paths (minimal-self/../../scripts, fake servers from tests/) line up.
        # PYTHONPATH=. makes `import src` work for the collection phase.
        working-directory: minimal-self
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q
