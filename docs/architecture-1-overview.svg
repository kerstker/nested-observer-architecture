<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" role="img"><title>乃爱整体架构</title><desc>输入层经感知进入 GlobalWorkspace 心智，再用模型、受权限与防火墙约束的外部工具和自我改进通道，全部落在一个记忆库上。</desc>
