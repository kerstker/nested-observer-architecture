<g class="c-teal"><rect x="200" y="526" width="440" height="38" rx="6" stroke-width="0.5"/><text class="ts" x="216" y="545.0" dominant-baseline="central">自诊断 · 适应度评估 · DSH · 维护请求</text></g>
