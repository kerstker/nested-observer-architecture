[pytest]
# Run the suite from this directory:
#   python -m pytest -q                     (what CI runs, and what the project notes say)
#   python -m unittest discover -s tests    (same tests, stdlib runner - they are unittest-style;
#                                            `-s tests` is needed because tests/ is not a package)
# `python -m` puts this directory on sys.path, so the tests can `import src` without an install.
testpaths = tests

# tests/ is the whole suite. Everything else here is state, not tests: data/ holds per-deployment
# scratch dirs, and one of them (data/tmp-tests) is left over from earlier sandboxed runs with 0o700
# ACLs that deny even reading. Without this, plain collection aborts with PermissionError before
# running a single test. models/ and the venvs are local-only, .trae/ is an editor dir.
norecursedirs =
    data
    models
    .venv*
    .trae
    __pycache__
    .*
